name: connect 4

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# Deliberately NOT the shared profile-commit group: GitHub supersedes a pending
# run when a newer one queues behind it, so sharing a group with the frequent
# profile and guestbook runs would silently drop a player's move.
concurrency:
  group: connect4-move
  cancel-in-progress: false

jobs:
  move:
    # Only the labelled game issue, and never the bot answering itself.
    if: contains(github.event.issue.labels.*.name, 'connect4') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The comment body is passed through the environment, never interpolated
      # into the shell — anyone on the internet can write it.
      - run: node scripts/connect4.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets data README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: connect 4 move"
            git pull --rebase --autostash
            git push
          fi
