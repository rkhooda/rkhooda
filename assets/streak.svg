<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 244" width="1200" height="244" role="img" aria-label="2253 contributions this year, a 170-day current streak and a 170-day longest streak">
  <title>170-day current streak, 170-day longest</title>
  <defs>
    <filter id="sglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0af68"/>
      <stop offset="1" stop-color="#ff7a5c"/>
    </linearGradient></defs>
  <style></style>
  <rect width="1200" height="244" rx="14" fill="#1a1b26"/>
  
  
  <g transform="translate(600 118)">
    <circle r="60" fill="none" stroke="#414868" stroke-opacity="0.35" stroke-width="6"/>
    <circle r="60" fill="none" stroke="url(#flame)" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="376.99" transform="rotate(-90)" filter="url(#sglow)">
      <animate attributeName="stroke-opacity" values="0.75;1;0.75" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <line x1="400" y1="36" x2="400" y2="216" stroke="#414868" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="800" y1="36" x2="800" y2="216" stroke="#414868" stroke-opacity="0.3" stroke-width="1"/>
  
  <text x="200" y="44" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8f99c0" letter-spacing="2.2">TOTAL CONTRIBUTIONS</text>
  <text x="200" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#7aa2f7">2,253</text>
  <text x="200" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#d6dcf5" letter-spacing="1.8">THIS YEAR</text>
  <text x="200" y="202" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f89b0">Aug 24 — Aug 28</text>
  
  <text x="600" y="44" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8f99c0" letter-spacing="2.2">CURRENT STREAK</text>
  <text x="600" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#e0af68">170</text>
  <text x="600" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#d6dcf5" letter-spacing="1.8">DAYS</text>
  <text x="600" y="202" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f89b0">Mar 12 — Aug 28</text>
  
  <text x="1000" y="44" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#8f99c0" letter-spacing="2.2">LONGEST STREAK</text>
  <text x="1000" y="126" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#bb9af7">170</text>
  <text x="1000" y="152" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#d6dcf5" letter-spacing="1.8">DAYS</text>
  <text x="1000" y="202" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#7f89b0">Mar 12 — Aug 28</text>
</svg>
